<style>@import url('https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,300;0,400;0,500;1,300&display=swap');:root{--forest:#0f3d2e;--forest-dark:#0a2b20;--cream:#f2f0e8;--card:#ffffff;--accent:#5A7F7F;--accent-dark:#466565;--ink:#1c2b24;--ink-soft:#5b6b62;--line:#ded8c8}.keuzehulp-widget *{box-sizing:border-box}.keuzehulp-widget{margin:0;font-family:'Karla',system-ui,sans-serif;font-weight:300;background:var(--cream);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:24px 16px}.keuzehulp-widget h1,.keuzehulp-widget h2,.keuzehulp-widget h3,.keuzehulp-widget .display{font-family:'Meditative',Georgia,serif;font-weight:400;letter-spacing:-0.01em}.keuzehulp-widget .wrap{width:100%;max-width:620px;position:relative}.keuzehulp-widget .lang-switch{position:absolute;top:14px;right:14px;z-index:5;display:flex;gap:2px;background:rgba(255,255,255,.9);border-radius:100px;padding:3px;box-shadow:0 1px 3px rgba(0,0,0,.08)}.keuzehulp-widget .lang-switch button{border:none;background:none;font-family:inherit;font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--ink-soft);cursor:pointer;padding:4px 8px;border-radius:100px}.keuzehulp-widget .lang-switch button.active{background:var(--forest);color:#fff}.keuzehulp-widget .lang-switch button:hover:not(.active){color:var(--forest-dark)}.keuzehulp-widget .card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:40px 36px;position:relative;overflow:hidden}.keuzehulp-widget .card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--accent)}.keuzehulp-widget .progress{display:flex;gap:6px;margin-bottom:28px}.keuzehulp-widget .progress .dot{height:4px;flex:1;background:var(--line);border-radius:2px;transition:background .3s ease}.keuzehulp-widget .progress .dot.done{background:var(--accent)}.keuzehulp-widget .progress .dot.active{background:var(--forest)}.keuzehulp-widget .eyebrow{letter-spacing:0.03em;font-size:12px;color:var(--ink-soft);margin:0 0 10px 0;font-weight:600}.keuzehulp-widget h2.question{font-size:26px;line-height:1.25;margin:0 0 28px 0;color:var(--forest-dark)}.keuzehulp-widget .hint-text{font-size:13px;color:var(--ink-soft);line-height:1.5;margin:-20px 0 24px 0}.keuzehulp-widget .options{display:grid;gap:12px}.keuzehulp-widget .options.two-col{grid-template-columns:1fr 1fr}.keuzehulp-widget .opt{display:flex;align-items:center;gap:14px;padding:16px 18px;border:1.5px solid var(--line);border-radius:4px;background:#fff;cursor:pointer;text-align:left;font-family:inherit;font-size:15px;color:var(--ink);transition:border-color .15s ease,background .15s ease}.keuzehulp-widget .opt:hover{border-color:var(--accent);background:#faf8f3}.keuzehulp-widget .opt .emoji{font-size:22px;line-height:1;flex-shrink:0}.keuzehulp-widget .opt .icon-img{width:26px;height:26px;object-fit:contain;flex-shrink:0}.keuzehulp-widget .opt.two-col .icon-img{width:22px;height:22px}.keuzehulp-widget .opt .label{font-weight:500}.keuzehulp-widget .opt .sub{display:block;font-size:13px;color:var(--ink-soft);font-weight:400;margin-top:2px}.keuzehulp-widget .back{margin-top:24px;background:none;border:none;color:var(--ink-soft);font-family:inherit;font-size:14px;cursor:pointer;padding:0;text-decoration:underline}.keuzehulp-widget .back:hover{color:var(--ink)}.keuzehulp-widget .result-head{display:flex;align-items:center;gap:12px;margin-bottom:8px}.keuzehulp-widget .result-head .tag{font-size:12px;letter-spacing:0.03em;color:#fff;background:var(--forest);padding:4px 10px;border-radius:100px;font-weight:600}.keuzehulp-widget .result-photo{display:block;width:100%;height:220px;object-fit:cover;border-radius:4px;margin:14px 0 4px 0}.keuzehulp-widget .result-title{font-size:28px;margin:12px 0 14px 0;color:var(--forest-dark)}.keuzehulp-widget .result-copy{font-size:15px;line-height:1.6;color:var(--ink);margin:0 0 28px 0}.keuzehulp-widget .result-copy b{color:var(--forest-dark)}.keuzehulp-widget .callout-note{background:#f2f0e8;border-left:3px solid var(--accent);border-radius:4px;padding:12px 14px;margin:0 0 20px 0;font-size:14px;line-height:1.5;color:var(--ink)}.keuzehulp-widget .callout-note b{color:var(--forest-dark)}.keuzehulp-widget .spec-tags{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 16px 0}.keuzehulp-widget .spec-tag{background:var(--cream);border:1px solid var(--line);border-radius:100px;padding:6px 14px;font-size:13px;color:var(--forest-dark);font-weight:500;white-space:nowrap}.keuzehulp-widget .cta{display:block;width:100%;background:var(--forest);color:#fff;border:none;border-radius:4px;padding:16px 20px;font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;text-align:center;text-decoration:none;box-sizing:border-box;transition:background .15s ease}.keuzehulp-widget .cta:hover{background:var(--forest-dark)}.keuzehulp-widget .cta-secondary{display:block;width:100%;background:transparent;color:var(--forest-dark);border:1.5px solid var(--line);border-radius:4px;padding:14px 20px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;text-align:center;text-decoration:none;box-sizing:border-box;margin-top:10px;transition:border-color .15s ease,background .15s ease}.keuzehulp-widget .cta-secondary:hover{border-color:var(--accent);background:#faf8f3}.keuzehulp-widget .input-row{display:flex;gap:10px;margin-bottom:8px}.keuzehulp-widget .number-input{flex:1;min-width:0;padding:16px 18px;border:1.5px solid var(--line);border-radius:4px;font-family:inherit;font-size:16px;color:var(--ink);background:#fff}.keuzehulp-widget .number-input:focus{outline:none;border-color:var(--accent)}.keuzehulp-widget .input-suffix{display:flex;align-items:center;color:var(--ink-soft);font-size:14px}.keuzehulp-widget .restart{display:block;text-align:center;margin-top:16px;font-size:13px;color:var(--ink-soft);text-decoration:underline;cursor:pointer;background:none;border:none;font-family:inherit;width:100%}.keuzehulp-widget .intro-options{display:grid;grid-template-columns:1fr 1fr
