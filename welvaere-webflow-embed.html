<!DOCTYPE html>

<head>

<title>Welvaere | Keuzehulp</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,300;0,400;0,500;1,300&display=swap');:root{--forest:#0f3d2e;--forest-dark:#0a2b20;--cream:#f2f0e8;--card:#ffffff;--accent:#5A7F7F;--accent-dark:#466565;--ink:#1c2b24;--ink-soft:#5b6b62;--line:#ded8c8}*{box-sizing:border-box}body{margin:0;font-family:'Karla',system-ui,sans-serif;font-weight:300;background:var(--cream);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}h1,h2,h3,.display{font-family:'Meditative',Georgia,serif;font-weight:400;letter-spacing:-0.01em}.wrap{width:100%;max-width:620px;position:relative}.lang-switch{position:absolute;top:14px;right:14px;z-index:5;display:flex;gap:2px;background:rgba(255,255,255,.9);border-radius:100px;padding:3px;box-shadow:0 1px 3px rgba(0,0,0,.08)}.lang-switch button{border:none;background:none;font-family:inherit;font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--ink-soft);cursor:pointer;padding:4px 8px;border-radius:100px}.lang-switch button.active{background:var(--forest);color:#fff}.lang-switch button:hover:not(.active){color:var(--forest-dark)}.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:40px 36px;position:relative;overflow:hidden}.card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--accent)}.progress{display:flex;gap:6px;margin-bottom:28px}.progress .dot{height:4px;flex:1;background:var(--line);border-radius:2px;transition:background .3s ease}.progress .dot.done{background:var(--accent)}.progress .dot.active{background:var(--forest)}.eyebrow{letter-spacing:0.03em;font-size:12px;color:var(--ink-soft);margin:0 0 10px 0;font-weight:600}h2.question{font-size:26px;line-height:1.25;margin:0 0 28px 0;color:var(--forest-dark)}.options{display:grid;gap:12px}.options.two-col{grid-template-columns:1fr 1fr}.opt{display:flex;align-items:center;gap:14px;padding:16px 18px;border:1.5px solid var(--line);border-radius:4px;background:#fff;cursor:pointer;text-align:left;font-family:inherit;font-size:15px;color:var(--ink);transition:border-color .15s ease,background .15s ease}.opt:hover{border-color:var(--accent);background:#faf8f3}.opt .emoji{font-size:22px;line-height:1;flex-shrink:0}.opt .icon-img{width:26px;height:26px;object-fit:contain;flex-shrink:0}.opt.two-col .icon-img{width:22px;height:22px}.opt .label{font-weight:500}.opt .sub{display:block;font-size:13px;color:var(--ink-soft);font-weight:400;margin-top:2px}.back{margin-top:24px;background:none;border:none;color:var(--ink-soft);font-family:inherit;font-size:14px;cursor:pointer;padding:0;text-decoration:underline}.back:hover{color:var(--ink)}.result-head{display:flex;align-items:center;gap:12px;margin-bottom:8px}.result-head .tag{font-size:12px;letter-spacing:0.03em;color:#fff;background:var(--forest);padding:4px 10px;border-radius:100px;font-weight:600}.result-photo{display:block;width:100%;height:220px;object-fit:cover;border-radius:4px;margin:14px 0 4px 0}.result-title{font-size:28px;margin:12px 0 14px 0;color:var(--forest-dark)}.result-copy{font-size:15px;line-height:1.6;color:var(--ink);margin:0 0 28px 0}.result-copy b{color:var(--forest-dark)}.callout-note{background:#f2f0e8;border-left:3px solid var(--accent);border-radius:4px;padding:12px 14px;margin:0 0 20px 0;font-size:14px;line-height:1.5;color:var(--ink)}.callout-note b{color:var(--forest-dark)}.spec-tags{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 16px 0}.spec-tag{background:var(--cream);border:1px solid var(--line);border-radius:100px;padding:6px 14px;font-size:13px;color:var(--forest-dark);font-weight:500;white-space:nowrap}.cta{display:block;width:100%;background:var(--forest);color:#fff;border:none;border-radius:4px;padding:16px 20px;font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;text-align:center;text-decoration:none;box-sizing:border-box;transition:background .15s ease}.cta:hover{background:var(--forest-dark)}.input-row{display:flex;gap:10px;margin-bottom:8px}.number-input{flex:1;padding:16px 18px;border:1.5px solid var(--line);border-radius:4px;font-family:inherit;font-size:16px;color:var(--ink);background:#fff}.number-input:focus{outline:none;border-color:var(--accent)}.input-suffix{display:flex;align-items:center;color:var(--ink-soft);font-size:14px}.restart{display:block;text-align:center;margin-top:16px;font-size:13px;color:var(--ink-soft);text-decoration:underline;cursor:pointer;background:none;border:none;font-family:inherit;width:100%}.intro-options{display:grid;grid-template-columns:1fr 1fr;gap:14px}.intro-opt{display:flex;flex-direction:column;align-items:center;gap:10px;padding:28px 16px;border:1.5px solid var(--line);border-radius:4px;background:#fff;cursor:pointer;font-family:inherit}.intro-opt:hover{border-color:var(--accent);background:#faf8f3}.options.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:stretch}.opt-photo{display:flex;flex-direction:column;padding:0;overflow:hidden;text-align:center;border:1.5px solid var(--line);border-radius:4px;background:#fff;cursor:pointer;font-family:inherit}.opt-photo:hover{border-color:var(--accent)}.opt-photo .opt-img{width:100%;aspect-ratio:1/1;object-fit:cover}.opt-photo .opt-label-wrap{padding:12px 10px}.opt-photo .opt-label-wrap .label{font-family:'Meditative',serif;font-size:15px;color:var(--forest-dark)}.opt-photo.no-image{display:flex;align-items:center;justify-content:center;padding:16px;height:100%;box-sizing:border-box}.opt-photo.no-image .label{font-size:15px;font-weight:500;margin-bottom:4px}.opt-photo.no-image .sub{font-size:12px;color:var(--ink-soft)}.intro-opt{padding:0;overflow:hidden}.intro-opt .intro-photo{width:100%;height:120px;object-fit:cover}.intro-opt .label-wrap{padding:14px 12px 18px}.intro-opt .emoji{font-size:34px}.intro-opt .label{font-family:'Meditative',serif;font-size:17px;color:var(--forest-dark)}@media (max-width:480px){.card{padding:28px 20px}h2.question{font-size:22px}.options.two-col{grid-template-columns:1fr}}</style>
